version: '3.8'

services:
  kv-file-pro:
    image: vndangkhoa/kv-file-pro:latest
    container_name: kv-file-pro
    restart: unless-stopped
    ports:
      - "8866:8866"
    environment:
      - KV_HOST=0.0.0.0
      - KV_PORT=8866
      - KV_DATA_DIR=/data
      - KV_STORAGE_ROOTS=/storage
      - RUST_LOG=kv_files=info,tower_http=info
      # MoMo Payment Settings (Personal Transfer or Official Gateway)
      - MOMO_PHONE_NUMBER=0398300340
      # - MOMO_RECEIVER_NAME=KHOA VO
      # - MOMO_PARTNER_CODE=YOUR_PARTNER_CODE
      # - MOMO_ACCESS_KEY=YOUR_ACCESS_KEY
      # - MOMO_SECRET_KEY=YOUR_SECRET_KEY
      # - MOMO_ENDPOINT=https://payment.momo.vn/v2/gateway/api/create
      # - MOMO_IPN_URL=https://your-domain.com/api/v1/payments/momo/ipn
    volumes:
      - ./data:/data
      - ./storage:/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8866/api/v1/auth/setup-status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
