version: '3.8'

services:
  kv-file-pro:
    image: vndangkhoa/kv-file-pro:latest
    container_name: kv-file-pro
    restart: unless-stopped
    ports:
      - "8866:8866"
    environment:
      - KV_HOST=0.0.0.0
      - KV_PORT=8866
      - KV_DATA_DIR=/data
      - KV_STORAGE_ROOTS=/storage
      - RUST_LOG=kv_files=info,tower_http=info
      # ZaloPay Official Payment Gateway Credentials (v2)
      - ZALOPAY_ENV=sandbox
      - ZALOPAY_APP_ID=2554
      - ZALOPAY_KEY1=sdngKKJmqEMzvh5QQcdD2A9XBSKUNaYn
      - ZALOPAY_KEY2=trMrHtvjo6myautxDUiAcYsVtaeQ8nhf
      - ZALOPAY_CREATE_ENDPOINT=https://sb-openapi.zalopay.vn/v2/create
      - ZALOPAY_QUERY_ENDPOINT=https://sb-openapi.zalopay.vn/v2/query
      - ZALOPAY_REDIRECT_URL=http://localhost:8866/settings?tab=extensions
      - ZALOPAY_CALLBACK_URL=http://localhost:8866/api/v1/payments/zalopay/callback
    volumes:
      - ./data:/data
      - ./storage:/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8866/api/v1/auth/setup-status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
